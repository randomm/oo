# Example oo configuration file
#
# Create this file at: ~/.config/oo/config.toml
# The file itself is optional. If [learn] is present, all three of its keys are
# required; omit the whole table to use the defaults.

# Configuration for `oo learn` (LLM-assisted pattern generation)
# The environment variable named by api_key_env must be set (here ANTHROPIC_API_KEY).
[learn]
# LLM provider (only "anthropic" is supported)
provider = "anthropic"

# Model identifier (required in [learn])
model = "claude-haiku-4-5"

# Environment variable containing the API key (required in [learn])
api_key_env = "ANTHROPIC_API_KEY"

# Retention for indexed command output (used by `oo recall`). See docs/configuration.md.
[store]
# Seconds. Entries older than this are purged when the same project next indexes
# output (default: 604800 = 7 days). 0 disables purging.
retention = 604800
